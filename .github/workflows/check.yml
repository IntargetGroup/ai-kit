name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo:
    name: budgets, public safety, internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: node scripts/check.mjs
        env:
          # Private patterns (names of colleagues, clients, brands) run on push to main only.
          # A pull request runs its own, unreviewed copy of check.mjs, which could print them.
          # On main the secret is required: an empty secret fails the job instead of passing it.
          CHECK_DENYLIST: ${{ github.event_name == 'push' && secrets.CHECK_DENYLIST || '' }}
          CHECK_DENYLIST_REQUIRED: ${{ github.event_name == 'push' && '1' || '' }}

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI image, not gitleaks-action: the action needs a license key on organization repos.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact --verbose /repo

  links:
    name: external links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          # Internal links are checked by check.mjs. 403 and 429 are bot walls and rate limits, not dead pages.
          # The Indeck MCP endpoint needs OAuth and answers no plain GET.
          # Links to this repo's main branch are resolved against the tree by check.mjs:
          # a file added in a PR is not on main until the PR merges.
          args: >-
            --no-progress
            --scheme https --scheme http
            --accept 200..=299,403,429
            --exclude-loopback
            --exclude '^https://mcp\.intarget\.net/'
            --exclude '^https://(github\.com|raw\.githubusercontent\.com)/IntargetGroup/ai-kit/'
            -- './**/*.md'
