name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo:
    name: budgets, copies, internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: node scripts/check.mjs

  secrets:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI image, not gitleaks-action: the action needs a license key on organization repos.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact --verbose /repo

